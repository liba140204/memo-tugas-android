name: Build Memo Tugas APK

on:
  workflow_dispatch:
  push:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract project
        run: |
          unzip Memo_Tugas_3_0_Android_Project.zip -d source

      - name: Build APK
        run: |
          gradle -p source/MemoTugas30 :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Memo-Tugas-3.0-APK
          path: source/MemoTugas30/app/build/outputs/apk/debug/app-debug.apk
          
