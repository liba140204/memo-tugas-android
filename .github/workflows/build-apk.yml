name: Build Memo Tugas APK

on:
  workflow_dispatch:
  push:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract project
        run: |
          mkdir -p source

          ZIP_FILE=$(find . -type f -iname '*.zip' \
            -not -path './.git/*' | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "File ZIP proyek tidak ditemukan"
            exit 1
          fi

          echo "Menggunakan file: $ZIP_FILE"
          unzip -o "$ZIP_FILE" -d source

      - name: Locate Android project
        run: |
          find source -name settings.gradle \
            -o -name settings.gradle.kts

      - name: Build APK
        run: |
          gradle -p source/MemoTugas30 :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Memo-Tugas-3.0-APK
          path: source/MemoTugas30/app/build/outputs/apk/debug/app-debug.apk
